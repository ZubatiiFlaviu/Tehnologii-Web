<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/login_style.css">
</head>
<body>
    <main class="login-container">
        <div class="login-image">
            <img src="../MEDIA/logo.png" alt="Site logo">
        </div>

        <div class="separator" aria-hidden="true"></div>

        <form class="login-form" action="#" method="get">
            <h1>Login</h1>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="Email" autocomplete="email" required>

            <label for="password">Parola</label>
            <input id="password" name="password" type="password" placeholder="Parola" autocomplete="current-password" required>

            <button type="submit">Login</button>

            <p class="register-text">
                Nu ai cont? <a href="register.html">Înregistrează-te</a>
            </p>
        </form>
    </main>
</body>
</html>
