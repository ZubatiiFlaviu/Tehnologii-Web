<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/login_style.css">
</head>
<body>
    <main class="login-container">
        <div class="login-image">
            <img src="../MEDIA/logo.png" alt="Site logo">
        </div>

        <div class="separator" aria-hidden="true"></div>

        <form class="login-form" id="loginForm" action="#" method="get" novalidate>
            <h1>Login</h1>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="nume.prenume@e-uvt.ro" autocomplete="username" aria-describedby="email-hint" required>
            <small class="login-hint" id="email-hint">Folosește formatul nume.prenume@e-uvt.ro; poți adăuga până la două cifre la final.</small>

            <label for="password">Parola</label>
            <input id="password" name="password" type="password" placeholder="Parola" autocomplete="current-password" aria-describedby="password-hint" required>
            <small class="login-hint" id="password-hint">Minimum 7 caractere: literă mare, literă mică, cifră și caracter special.</small>

            <p class="login-message" id="loginMessage" role="status" aria-live="polite"></p>

            <button type="submit">Login</button>

            <p class="register-text">
                Nu ai cont? <a href="register.html">Înregistrează-te</a>
            </p>
        </form>
    </main>
    <script src="../JS/login_js.js"></script>
</body>
</html>
